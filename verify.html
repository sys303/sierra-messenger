<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sierra Messenger — подтверждение почты</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .verify-wrap { position: relative; z-index: 1; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    .verify-wrap .logo { display: flex; justify-content: center; margin-bottom: 24px; }
  </style>
</head>
<body>
  <div class="bg-glow"><span></span><span></span><span></span></div>

  <main class="verify-wrap">
    <div style="width:100%;max-width:440px">
      <a class="logo fade-up" href="index.html">
        <svg viewBox="0 0 40 40"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fd6ff"/><stop offset="1" stop-color="#1d6bff"/></linearGradient></defs><path d="M20 3C10.6 3 3 9.7 3 18c0 4.4 2.1 8.3 5.5 11L7 37l8.2-4.3c1.5.4 3.1.6 4.8.6 9.4 0 17-6.7 17-15S29.4 3 20 3z" fill="url(#lg)"/><path d="M9 24l6.5-9 4 5 3-3.8L31 24z" fill="#021220"/></svg>
        Sierra <b>Messenger</b>
      </a>

      <section class="card center fade-up d1">
        <div class="mail-icon">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#4cc9ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3.5 7 8.5 6 8.5-6"/></svg>
        </div>
        <h2>Проверь почту</h2>
        <p class="sub">Мы отправили код на<br><span class="email-pill" id="emailText">твою почту</span></p>

        <form id="codeForm" novalidate>
          <div class="code-inputs" id="codeInputs"></div>
          <button class="btn" id="verifyBtn" type="submit">Подтвердить</button>
        </form>

        <div class="resend">
          Не пришло? Проверь «Спам» или
          <button class="link-btn" id="resendBtn" type="button">отправь снова</button>
          <span id="timer"></span>
        </div>
        <p class="switch"><a href="register.html">← Изменить почту</a></p>
      </section>
    </div>
  </main>

  <script type="module">
    import { sb, showConfigBannerIfNeeded } from './js/supabase.js';
    import { CODE_LENGTH } from './js/config.js';
    import { toast, setLoading, ruError, qs } from './js/ui.js';

    const notConfigured = showConfigBannerIfNeeded();
    const email = (qs('email') || '').trim().toLowerCase();
    if (!email) location.replace('register.html');
    document.getElementById('emailText').textContent = email;

    // ---- Ячейки для кода ----
    const box = document.getElementById('codeInputs');
    const cells = [];
    for (let i = 0; i < CODE_LENGTH; i++) {
      const inp = document.createElement('input');
      inp.inputMode = 'numeric';
      inp.autocomplete = i === 0 ? 'one-time-code' : 'off';
      inp.maxLength = CODE_LENGTH; // для вставки целого кода
      inp.setAttribute('aria-label', `Цифра ${i + 1}`);
      box.appendChild(inp);
      cells.push(inp);
    }

    function fillFrom(index, digits) {
      for (let i = 0; i < digits.length && index + i < CODE_LENGTH; i++) cells[index + i].value = digits[i];
      cells.forEach((c) => c.classList.toggle('filled', !!c.value));
      const next = cells.find((c) => !c.value);
      (next || cells[CODE_LENGTH - 1]).focus();
      if (getCode().length === CODE_LENGTH) submit();
    }

    cells.forEach((cell, i) => {
      cell.addEventListener('input', () => {
        const digits = cell.value.replace(/\D/g, '');
        cell.value = '';
        if (digits) fillFrom(i, digits);
        else cell.classList.remove('filled');
      });
      cell.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !cell.value && i > 0) {
          cells[i - 1].value = '';
          cells[i - 1].classList.remove('filled');
          cells[i - 1].focus();
          e.preventDefault();
        }
        if (e.key === 'ArrowLeft' && i > 0) cells[i - 1].focus();
        if (e.key === 'ArrowRight' && i < CODE_LENGTH - 1) cells[i + 1].focus();
      });
      cell.addEventListener('paste', (e) => {
        e.preventDefault();
        const digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '');
        if (digits) fillFrom(i, digits);
      });
      cell.addEventListener('focus', () => cell.select());
    });
    cells[0].focus();

    const getCode = () => cells.map((c) => c.value).join('');

    // ---- Проверка кода ----
    const btn = document.getElementById('verifyBtn');
    let busy = false;
    async function submit() {
      if (busy) return;
      if (notConfigured) return toast('Сначала подключи Supabase в js/config.js', 'error');
      const token = getCode();
      if (token.length !== CODE_LENGTH) return toast(`Введи все ${CODE_LENGTH} цифр`, 'error');

      busy = true;
      setLoading(btn, true);
      const { error } = await sb.auth.verifyOtp({ email, token, type: 'email' });
      setLoading(btn, false);
      busy = false;

      if (error) {
        box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
        cells.forEach((c) => { c.value = ''; c.classList.remove('filled'); });
        cells[0].focus();
        return toast(ruError(error), 'error');
      }
      box.classList.add('success');
      toast('Почта подтверждена! Добро пожаловать в Sierra 🎉', 'success');
      setTimeout(() => location.replace('app.html'), 700);
    }
    document.getElementById('codeForm').addEventListener('submit', (e) => { e.preventDefault(); submit(); });

    // ---- Повторная отправка с таймером ----
    const resendBtn = document.getElementById('resendBtn');
    const timerEl = document.getElementById('timer');
    let left = 0, tick;
    function startTimer(sec = 60) {
      left = sec;
      resendBtn.disabled = true;
      clearInterval(tick);
      const draw = () => { timerEl.textContent = left > 0 ? `через ${left} сек.` : ''; };
      draw();
      tick = setInterval(() => {
        left--; draw();
        if (left <= 0) { clearInterval(tick); resendBtn.disabled = false; }
      }, 1000);
    }

    async function resend() {
      if (notConfigured) return;
      const { error } = await sb.auth.resend({ type: 'signup', email });
      if (error) {
        const m = error.message.match(/after (\d+) seconds/i);
        if (m) startTimer(+m[1]);
        return toast(ruError(error), 'error');
      }
      toast('Новый код отправлен на почту', 'success');
      startTimer(60);
    }
    resendBtn.addEventListener('click', resend);

    if (qs('resend') === '1') resend(); else startTimer(60);
  </script>
</body>
</html>
